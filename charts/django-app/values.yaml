image:
  repository: 381414049346.dkr.ecr.eu-central-1.amazonaws.com/lesson-7-ecr
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: LoadBalancer
  port: 80

configmap:
  name: django-config
  env:
    DJANGO_SECRET_KEY: "your-secret-key"
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: "*"

hpa:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
