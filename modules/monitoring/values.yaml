grafana:
  adminPassword: "${GRAFANA_ADMIN_PASSWORD}"
  service:
    type: ClusterIP
  # Enable Grafana sidecar to pick up dashboards from ConfigMaps and provision datasources
  sidecar:
    datasources:
      enabled: true
    dashboards:
      enabled: true
      label: grafana_dashboard

  # Provision an additional datasource pointing to the Prometheus instance installed by this chart
  additionalDataSources:
    - name: Prometheus
      type: prometheus
      url: http://kube-prometheus-stack-prometheus:9090
      access: proxy
      isDefault: true

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
