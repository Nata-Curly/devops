controller:
  ingress:
    enabled: false
  # Admin user/password can be provided here or via Kubernetes Secret. Prefer using Jenkins' credentials store.
  # Using a static password here is only for quick testing — consider using sealed secrets or external secrets in production.
  adminUser: admin
  adminPassword: "CHANGE_ME_ADMIN_PASSWORD"

agent:
  enabled: true
  kubernetes:
    # agents will use a service account with permissions to run Kaniko, and to access ECR if needed.
    # Configure your podTemplates / container templates in Jenkins UI or via additional chart values.
    podTemplates: []

persistence:
  enabled: true
  size: 10Gi

service:
  type: ClusterIP

# Recommended: increase resources according to your cluster size
resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1000m"
    memory: "1Gi"

# Security: disable anonymous read access
rbac:
  create: true
