{{- range .Values.applications }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  project: {{ .project }}
  source:
    repoURL: "{{ .repoURL }}"
    targetRevision: "{{ .targetRevision }}"
    path: "{{ .path }}"
  destination:
    server: "{{ .destination.server }}"
    namespace: "{{ .destination.namespace }}"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
{{- end }}
